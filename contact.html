    <!-- Message Form -->

        <div class="cf-field">
          <label class="cf-field-label">Your Name</label>

        </div>
      </div>
      <div class="cf-field">
        <label class="cf-field-label">Message</label>
        <textarea id="cfMessage" class="cf-input cf-textarea" placeholder="Your question, feedback or message..." required></textarea>
      </div>
      <button type="submit" class="cf-btn">
        <span>Send Message</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="16" height="16"><path d="M22 2L11 13"/><path d="M22 2L15 22 11 13 2 9l20-7z"/></svg>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script src="js/contact.js"></script>
  <script>
    // Copy on click
    const toast = document.createElement('div');
    toast.id = 'copy-toast';
    toast.style.cssText = `
      position:fixed; bottom:32px; left:50%; transform:translateX(-50%) translateY(20px);
      background:rgba(14,14,26,0.95); border:1px solid rgba(200,184,162,0.3);
      color:#c8b8a2; font-family:'Space Mono',monospace; font-size:0.6rem;
      letter-spacing:0.2em; text-transform:uppercase; padding:10px 24px;
      border-radius:2px; opacity:0; transition:opacity 0.3s, transform 0.3s;
      pointer-events:none; z-index:9999;
    `;
    document.body.appendChild(toast);

    document.querySelectorAll('[data-copy]').forEach(el => {
      el.style.cursor = 'pointer';
      el.addEventListener('click', () => {
        navigator.clipboard.writeText(el.dataset.copy).then(() => {
          toast.textContent = 'Copied!';
          toast.style.opacity = '1';
          toast.style.transform = 'translateX(-50%) translateY(0)';
          clearTimeout(toast._t);
          toast._t = setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transform = 'translateX(-50%) translateY(20px)';
          }, 1800);
        });
      });
    });

    // Form submit — opens Gmail with prefilled message
    document.getElementById('contactForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const name    = document.getElementById('cfName').value.trim();
      const email   = document.getElementById('cfEmail').value.trim();
      const message = document.getElementById('cfMessage').value.trim();
      const subject = encodeURIComponent(`Message from ${name} — Portfolio`);
      const body    = encodeURIComponent(`Name: ${name}\nEmail: ${email}\n\nMessage:\n${message}`);
      window.open(`mailto:kushalkshah1606@gmail.com?subject=${subject}&body=${body}`, '_blank');
    });
  </script>
